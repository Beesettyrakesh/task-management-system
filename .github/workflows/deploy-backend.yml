name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch: # Allows manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"
          cache: "maven"

      # 3. Build the applicaiton
      - name: Build with Maven
        run: |
          cd backend
          mvn clean package

      # 4. Get build artifact name
      - name: Get artifact name
        id: artifact
        run: |
          cd backend/target
          echo "jar_file=$(ls *.jar)" >> $GITHUB_OUTPUT

      # 5. Deplot to EC2
      - name: Deploy to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # Save SSH key
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          # Upload JAR to EC2
          scp -i private_key.pem \
              -o StrictHostKeyChecking=no \
              backend/target/*.jar \
              $EC2_USER@$EC2_HOST:/home/ec2-user/task-management-system/backend/target/

          # Restart applicaiton on EC2
          ssh -i private_key.pem \
              -o StrictHostKeyChecking=no \
              $EC2_USER@$EC2_HOST << 'EOF'
            sudo systemctl restart taskmanagement
            sleep 5
            sudo systemctl status taskmanagement --no-pager
          EOF

          # Clean up
          rm -f private_key.pem

      # 6. Notify on success
      - name: Deployment Success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Backend deployed to EC2 at $(date)"

      # 7. Notify in failure
      - name: Deployment failure
        if: failure()
        run: |
            echo "❌ Deployment failed!"
            
