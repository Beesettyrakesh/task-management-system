# Development Environment Configuration
# Enhanced logging for debugging and development

# Root logging level - more verbose for development
logging.level.root=INFO

# Application-specific logging - DEBUG level for detailed insights
logging.level.com.rakesh.taskmanagement=DEBUG

# Spring framework logging - INFO level to avoid spam
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG

# Database and SQL logging for development debugging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ⚡ QUERY OPTIMIZATION: Enhanced SQL logging for performance analysis
logging.level.org.hibernate.stat=DEBUG
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=DEBUG

# HTTP client logging for API development
logging.level.org.springframework.web.client=DEBUG

# Enable SQL parameter logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ⚡ QUERY OPTIMIZATION: Enable detailed Hibernate statistics
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=50

# ⚡ QUERY OPTIMIZATION: Enable batch processing for better performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Mail logging for email development
logging.level.org.springframework.mail=DEBUG

# File upload debugging
logging.level.org.springframework.web.multipart=DEBUG

# Custom interceptor detailed logging
logging.level.com.rakesh.taskmanagement.config.RequestResponseLoggingInterceptor=DEBUG
