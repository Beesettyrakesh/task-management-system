# Production Environment Configuration
# Optimized logging for production performance and security

# Root logging level - WARN to minimize log volume
logging.level.root=WARN

# Application-specific logging - INFO level for operational insights
logging.level.com.rakesh.taskmanagement=INFO

# Spring framework logging - WARN level to reduce noise
logging.level.org.springframework=WARN
logging.level.org.springframework.security=INFO

# Database logging - disabled for production performance
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Disable SQL logging for production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production database settings - no statistics for performance
spring.jpa.properties.hibernate.generate_statistics=false

# Mail logging - minimal for production
logging.level.org.springframework.mail=WARN

# File upload - INFO level for monitoring
logging.level.org.springframework.web.multipart=INFO

# Custom interceptor - INFO level for request tracking
logging.level.com.rakesh.taskmanagement.config.RequestResponseLoggingInterceptor=INFO

# Error logging - ensure all errors are captured
logging.level.com.rakesh.taskmanagement.exception.GlobalExceptionHandler=INFO

# Security logging for production monitoring
logging.level.com.rakesh.taskmanagement.service.UserService=INFO
logging.level.com.rakesh.taskmanagement.controller.AuthController=INFO

# Performance monitoring
logging.level.com.rakesh.taskmanagement.service.TaskService=INFO

# Production-specific logging configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n

# Log file rotation for production
logging.file.name=logs/task-management-app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Swagger/OpenAPI Configuration for Production
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.rakesh.taskmanagement.controller
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
server.forward-headers-strategy=framework

